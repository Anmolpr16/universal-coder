<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Coder</title><style>body{font-family:system-ui;max-width:900px;margin:2rem auto;padding:0 1rem}textarea,input{width:100%;box-sizing:border-box;margin:.4rem 0;padding:.7rem}button{padding:.7rem 1rem}pre{white-space:pre-wrap;background:#f5f5f5;padding:1rem;min-height:12rem}</style></head><body><h1>Universal Coder</h1><label>Server endpoint</label><input id="endpoint" value="http://127.0.0.1:8765"><label>Bearer token</label><input id="token" type="password"><label>Workspace</label><input id="workspace" value="."><label>Task</label><textarea id="task" rows="7" placeholder="Fix the failing tests..."></textarea><button id="run">Run</button><pre id="out">Ready.</pre><script>const $=id=>document.getElementById(id);$('run').onclick=async()=>{const base=$('endpoint').value.replace(/\/$/,''),h={'Content-Type':'application/json'},t=$('token').value;if(t)h.Authorization='Bearer '+t;$('out').textContent='Submitting...';try{const r=await fetch(base+'/run',{method:'POST',headers:h,body:JSON.stringify({objective:$('task').value,workspace:$('workspace').value})});const j=await r.json();if(!r.ok)throw Error(j.error||r.status);$('out').textContent='Run '+j.run_id+'\n';let done=false;while(!done){await new Promise(x=>setTimeout(x,800));const s=await fetch(base+j.status_url,{headers:t?{Authorization:'Bearer '+t}:{}});const x=await s.json();$('out').textContent='Run '+j.run_id+'\nStatus: '+x.status+'\n\n'+JSON.stringify(x.record,null,2);done=['complete','failed','not_found','completed'].includes(x.status)}}catch(e){$('out').textContent='Error: '+e}}</script></body></html>
